<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Concierge</title>
<!-- Optional: used only to draw A2UI Icon components. If it can't load (offline/
     corp network), icons fall back to showing their name as text. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root {
    --accent: #0d9488;
    --accent-dark: #0f766e;
    --accent-light: #14b8a6;
    --header-bg: linear-gradient(135deg, #0f766e 0%, #0d9488 100%);
    --bg-gradient: radial-gradient(circle at 50% 0%, #f0fdf4 0%, #f8fafc 100%);
    --bg: #f8fafc;
    --card-bg: #ffffff;
    --border: #e2e8f0;
    --text-primary: #1e293b;
    --text-secondary: #64748b;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
    --shadow-lg: 0 10px 25px -5px rgba(13, 148, 136, 0.1);
  }
  * { box-sizing:border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-gradient);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    color: var(--text-primary);
  }
  .app-card {
    width: 100%;
    max-width: 880px;
    height: 94vh;
    background: var(--card-bg);
    border-radius: 20px;
    box-shadow: var(--shadow-lg);
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    background: var(--header-bg);
    color: #fff;
    padding: 1rem 1.4rem;
    font-weight: 700;
    font-size: 1.2rem;
    letter-spacing: 0.02em;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .reset-btn {
    margin-left: auto;
    background: rgba(255,255,255,0.18);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 16px;
    padding: 0.35rem 0.8rem;
    font-size: 0.8rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .reset-btn:hover {
    background: rgba(255,255,255,0.35);
  }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1.2rem;
    background: var(--bg-gradient);
  }
  .msg {
    display: flex;
    flex-direction: column;
    max-width: 85%;
    animation: fadeIn 0.25s ease-out;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .msg.user {
    align-self: flex-end;
    align-items: flex-end;
  }
  .msg.agent {
    align-self: flex-start;
    align-items: flex-start;
  }
  .sender-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.3rem;
    padding: 0 0.4rem;
  }
  .sender-label {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-secondary);
  }
  .msg-time {
    font-size: 0.7rem;
    color: #94a3b8;
  }
  .bubble {
    position: relative;
    padding: 0.85rem 1.2rem;
    border-radius: 18px;
    background: #ffffff;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    color: var(--text-primary);
    line-height: 1.5;
    white-space: pre-wrap;
    font-size: 0.95rem;
  }
  .msg.user .bubble {
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
    color: #ffffff;
    border: none;
    border-top-right-radius: 4px;
    box-shadow: var(--shadow-md);
  }
  .msg.agent .bubble {
    border-top-left-radius: 4px;
  }
  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    box-shadow: none;
    max-width: 100%;
    white-space: normal;
  }
  .bubble a {
    color: var(--accent-dark);
    text-decoration: underline;
    word-break: break-all;
  }
  .msg.user .bubble a {
    color: #ffffff;
  }

  .copy-btn {
    margin-top: 0.4rem;
    align-self: flex-end;
    background: transparent;
    border: none;
    color: var(--text-secondary);
    font-size: 0.75rem;
    cursor: pointer;
    opacity: 0.7;
    transition: opacity 0.2s;
  }
  .copy-btn:hover { opacity: 1; color: var(--accent-dark); }

  /* Typing indicator */
  .typing-indicator { display: inline-flex; align-items: center; gap: 4px; padding: 4px 6px; }
  .typing-indicator span { width: 7px; height: 7px; background: var(--accent); border-radius: 50%; animation: pulseDots 1.4s infinite ease-in-out both; }
  .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
  .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
  @keyframes pulseDots { 0%, 80%, 100% { transform: scale(0.3); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }

  /* --- Category Tabs & Prompt Chips --- */
  .category-tabs {
    display: flex;
    gap: 0.4rem;
    padding: 0.6rem 1.2rem 0;
    background: #ffffff;
    border-top: 1px solid var(--border);
    justify-content: center;
  }
  .tab-btn {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    font-size: 0.8rem;
    font-weight: 600;
    padding: 0.3rem 0.7rem;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .tab-btn.active, .tab-btn:hover {
    background: var(--bg);
    color: var(--accent-dark);
  }

  .prompts-container {
    display: flex;
    gap: 0.6rem;
    padding: 0.6rem 1.2rem;
    background: #ffffff;
    overflow-x: auto;
    justify-content: center;
  }
  .prompt-chip {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-primary);
    border-radius: 20px;
    padding: 0.45rem 0.95rem;
    font-size: 0.825rem;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .prompt-chip:hover {
    background: var(--accent);
    color: #ffffff;
    border-color: var(--accent);
    transform: translateY(-1px);
    box-shadow: var(--shadow-sm);
  }
  .prompt-chip.hidden { display: none; }

  /* Form controls */
  form {
    display: flex;
    gap: 0.75rem;
    padding: 1rem 1.2rem;
    background: #ffffff;
    border-top: 1px solid var(--border);
  }
  input {
    flex: 1;
    padding: 0.8rem 1.1rem;
    border: 1px solid var(--border);
    border-radius: 24px;
    font-size: 0.95rem;
    outline: none;
    transition: all 0.2s ease;
    background: var(--bg);
  }
  input:focus {
    border-color: var(--accent);
    background: #ffffff;
    box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.15);
  }
  button.send-btn {
    padding: 0.8rem 1.4rem;
    border: none;
    border-radius: 24px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
    color: #ffffff;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: var(--shadow-sm);
  }
  button.send-btn:hover {
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
  }

  /* A2UI components */
  .a2card { border:1px solid var(--border); border-radius:16px; padding:1.2rem; background:#fff; box-shadow:var(--shadow-md); max-width:100%; }
  .a2card + .a2card, .a2col > .a2card { margin-top:.6rem; }
  .a2col { display:flex; flex-direction:column; gap:.4rem; }
  .a2row { display:flex; flex-direction:row; gap:.6rem; align-items:center; flex-wrap:wrap; }
  .a2row.between { justify-content:space-between; }
  .a2text { margin:0; line-height:1.4; }
  .a2text.a2-h1 { font-size:1.5rem; font-weight:700; color:var(--accent-dark); }
  .a2text.a2-h2 { font-size:1.25rem; font-weight:700; }
  .a2text.a2-h3 { font-size:1.1rem; font-weight:600; }
  .a2text.a2-h4 { font-size:1rem; font-weight:600; }
  .a2text.a2-caption { font-size:.85rem; color:var(--text-secondary); }
  .a2divider { border:none; border-top:1px solid var(--border); margin:.4rem 0; width:100%; }
  .a2img { max-width:100%; border-radius:12px; display:block; margin-top:0.4rem; }
  .material-symbols-outlined { font-family:'Material Symbols Outlined'; font-size:1.25rem; line-height:1; vertical-align:middle; color:var(--accent); }
</style>
</head>
<body>
<div class="app-card">
  <header>
    <span>✈️ Travel Concierge</span>
    <button type="button" class="reset-btn" onclick="resetConversation()">🔄 New Chat</button>
  </header>

  <div id="log"></div>

  <div class="category-tabs">
    <button type="button" class="tab-btn active" onclick="filterPrompts('all', this)">All</button>
    <button type="button" class="tab-btn" onclick="filterPrompts('itinerary', this)">✈️ Itineraries</button>
    <button type="button" class="tab-btn" onclick="filterPrompts('places', this)">🏨 Places</button>
    <button type="button" class="tab-btn" onclick="filterPrompts('visuals', this)">🎨 Visuals</button>
  </div>

  <div class="prompts-container">
    <button class="prompt-chip" data-category="itinerary" type="button" onclick="sendPrompt('Plan a 3-day itinerary for Tokyo')">✈️ 3-Day Tokyo Itinerary</button>
    <button class="prompt-chip" data-category="places" type="button" onclick="sendPrompt('Find top-rated restaurants in Paris')">🏨 Places in Paris</button>
    <button class="prompt-chip" data-category="visuals" type="button" onclick="sendPrompt('Generate an image of a luxury beach resort')">🎨 Beach Resort Image</button>
    <button class="prompt-chip" data-category="itinerary" type="button" onclick="sendPrompt('What are the top things to do in Kyoto?')">🏯 Kyoto Highlights</button>
    <button class="prompt-chip" data-category="places" type="button" onclick="sendPrompt('Find coffee shops near Eiffel Tower')">☕ Coffee near Eiffel Tower</button>
  </div>

  <form id="form">
    <input id="input" placeholder="Ask something…" autocomplete="off" autofocus>
    <button class="send-btn">Send</button>
  </form>
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
let currentUserId = "user-" + Date.now();

function resetConversation() {
  currentUserId = "user-" + Date.now();
  log.innerHTML = "";
  input.value = "";
  const b = bubble("agent");
  b.innerHTML = "Conversation reset! How can I assist with your travels today?";
}

function filterPrompts(cat, btn) {
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  document.querySelectorAll(".prompt-chip").forEach(chip => {
    if (cat === "all" || chip.dataset.category === cat) {
      chip.classList.remove("hidden");
    } else {
      chip.classList.add("hidden");
    }
  });
}

function sendPrompt(promptText) {
  input.value = promptText;
  form.requestSubmit();
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function getTimeStr() {
  const now = new Date();
  return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function bubble(who) {
  const m = el("div", "msg " + who);
  const row = el("div", "sender-row");
  const label = el("span", "sender-label", who === "user" ? "You" : "✈️ Concierge");
  const time = el("span", "msg-time", getTimeStr());
  row.appendChild(label);
  row.appendChild(time);

  const b = el("div", "bubble");
  m.appendChild(row);
  m.appendChild(b);
  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return b;
}

function formatMarkdown(text) {
  if (!text) return "";
  let esc = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  // Bold **text**
  esc = esc.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  // URLs https://...
  esc = esc.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  // Bullet lists
  esc = esc.replace(/^[\*\-] (.*$)/gim, '• $1');
  return esc;
}

function addCopyButton(msgDiv, textContent) {
  if (!textContent) return;
  const btn = el("button", "copy-btn", "📋 Copy");
  btn.type = "button";
  btn.onclick = () => {
    navigator.clipboard.writeText(textContent);
    btn.textContent = "✓ Copied!";
    setTimeout(() => { btn.textContent = "📋 Copy"; }, 2000);
  };
  msgDiv.appendChild(btn);
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * -------------------------------------------------------------------------- */
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.innerHTML = formatMarkdown(boundStr(props.text));
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.innerHTML = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) {
    const textNode = el("div", null);
    textNode.innerHTML = formatMarkdown(textStr);
    b.appendChild(textNode);
    addCopyButton(b.parentElement, textStr);
  }

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) {
      const flat = flattenText(a2ui);
      b.appendChild(el("div", null, flat || "(no card content)"));
      addCopyButton(b.parentElement, flat);
    }
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  
  const userBubble = bubble("user");
  userBubble.textContent = text;
  input.value = "";

  const agentBubble = bubble("agent");
  agentBubble.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, user_id: currentUserId })
    });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(agentBubble, data.parts || []);
  } catch (e) {
    agentBubble.textContent = "Error: " + e.message;
  }
});
</script>
</body>
</html>
